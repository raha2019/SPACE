<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="760" viewBox="0 0 1020 760">
  <defs><style>
    .bg { fill: #fbfbf9; }
    .wall { stroke: #333; stroke-width: 4; stroke-linecap: square; }
    .door { stroke: #2a7a2a; stroke-width: 4; }
    .door-label { font: 9px Arial; fill: #2a7a2a; text-anchor: middle; }
    .machine { fill: #eef2f7; stroke: #7a90a8; stroke-width: 1; }
    .amenity { fill: #fff3cd; stroke: #c8a000; stroke-width: 1; }
    .m-label { font: 8px Arial; fill: #333; text-anchor: middle; dominant-baseline: central; }
    .zone-label { font: 11px Arial; fill: #666; font-style: italic; }
    .zone-label.zc { fill: #b00; }
    .dim { stroke: #b00; stroke-width: 1; stroke-dasharray: 4 3; }
    .cal { fill: #b00; }
    .cal-label { font: 9px Arial; fill: #b00; text-anchor: middle; }
    .cal-note { font: 10px Arial; fill: #b00; text-anchor: middle; font-weight: bold; }
    .title { font: 13px Arial; fill: #222; }
  </style></defs>
  <rect class="bg" x="0" y="0" width="1020" height="760"/>
  <text x="60" y="720" class="title">SPACE Diagnostic Floor Plan — 60 x 40 ft, notched SE corner, 3 zones. Drawn to scale (15 px/ft).</text>
  <text x="60" y="738" class="title" style="font-size:10px;fill:#666">ADA pinch: tsaw / wjet leave ~2 ft (&lt;36 in) across the bridge-&gt;exitB path. Zone C has NO exit.</text>
    
    <line x1="60" y1="40" x2="960" y2="40" class="dim"/>
    <circle cx="60" cy="40" r="5" class="cal"/><text x="60" y="30" class="cal-label">A (0 ft)</text>
    <circle cx="960" cy="40" r="5" class="cal"/><text x="960" y="30" class="cal-label">B (60 ft)</text>
    <text x="510" y="30" class="cal-note">CALIBRATION: click A then B, enter 60 ft  (=> 15 px/ft)</text>
    <line x1="60" y1="80" x2="240" y2="80" class="wall"/>
    <line x1="285" y1="80" x2="960" y2="80" class="wall"/>
    <line x1="960" y1="80" x2="960" y2="230" class="wall"/>
    <line x1="960" y1="275" x2="960" y2="500" class="wall"/>
    <line x1="960" y1="500" x2="735" y2="500" class="wall"/>
    <line x1="735" y1="500" x2="735" y2="680" class="wall"/>
    <line x1="735" y1="680" x2="60" y2="680" class="wall"/>
    <line x1="60" y1="680" x2="60" y2="80" class="wall"/>
    <line x1="510" y1="80" x2="510" y2="230" class="wall"/>
    <line x1="510" y1="275" x2="510" y2="680" class="wall"/>
    <line x1="60" y1="455" x2="510" y2="455" class="wall"/>
    <line x1="240" y1="80" x2="285" y2="80" class="door"/><text x="262.5" y="76" class="door-label">exitA</text>
    <line x1="960" y1="230" x2="960" y2="275" class="door"/><text x="960" y="248.5" class="door-label">exitB</text>
    <line x1="510" y1="230" x2="510" y2="275" class="door"/><text x="510" y="248.5" class="door-label">bridge</text>
    <rect x="330" y="128" width="36" height="24" class="machine"/><text x="348" y="140" class="m-label">p3d</text>
    <rect x="132" y="290" width="53.99999999999999" height="24" class="machine"/><text x="159" y="302" class="m-label">elec</text>
    <rect x="240" y="290" width="36" height="24" class="machine"/><text x="258" y="302" class="m-label">sander</text>
    <rect x="690" y="200" width="53.99999999999999" height="30" class="machine"/><text x="717" y="215" class="m-label">tsaw</text>
    <rect x="690" y="260" width="53.99999999999999" height="30" class="machine"/><text x="717" y="275" class="m-label">wjet</text>
    <rect x="762" y="188" width="53.99999999999999" height="30" class="machine"/><text x="788.9999999999999" y="203" class="m-label">weld</text>
    <rect x="825" y="350" width="53.99999999999999" height="30" class="machine"/><text x="852" y="365" class="m-label">laser</text>
    <rect x="915" y="440" width="26.999999999999996" height="18.000000000000004" class="machine"/><text x="928.5" y="449" class="m-label">grind</text>
    <rect x="672" y="152" width="9" height="6" class="amenity"/><text x="676.4999999999999" y="155" class="m-label">fireExt1</text>
    <rect x="105" y="110" width="9" height="6" class="amenity"/><text x="109.5" y="113" class="m-label">eyewash1</text>
    <text x="285" y="260" class="zone-label">ZONE A (reachable, 750 sf)</text>
    <text x="780" y="380" class="zone-label">ZONE B (reachable, 1020 sf)</text>
    <text x="285" y="575" class="zone-label zc">ZONE C — UNREACHABLE (no exit, 450 sf)</text>
</svg>
